<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NOVVO — The Screenless Strap Specialists</title>
  <meta name="description" content="Silicone, nylon, leather and sport flex straps for WHOOP, Garmin Cirqa and Fitbit Air. Laser engraving and charms. Delivered across Kuwait and the GCC." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="assets/novvo-logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>history.scrollRestoration = "manual";</script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
</head>
<body>
  <!-- preloader -->
  <div class="loader" id="loader" aria-hidden="true">
    <div id="loaderLogo"></div>
    <div class="loader__bar"><i id="loaderBar"></i></div>
  </div>

  <!-- page transition curtain -->
  <div class="curtain" id="curtain" aria-hidden="true"><span class="curtain__logo" id="curtainLogo"></span></div>


  <div class="announce"><div class="announce__track" id="announce"></div></div>

  <header class="nav" id="nav">
    <a href="#/" class="nav__logo" id="navLogo" aria-label="NOVVO home"></a>
    <nav class="nav__links" id="navLinks"></nav>
    <div class="nav__tools">
      <label class="select select--ghost" aria-label="Currency">
        <select id="currency"></select>
      </label>
      <button class="lang" id="langBtn" type="button" aria-label="Switch language"></button>
      <button class="cart-btn" id="cartBtn" type="button" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="lbl" id="cartLbl">Cart</span><span class="cart-btn__count" id="cartCount">0</span>
      </button>
      <button class="burger" id="burger" type="button" aria-label="Menu"><i></i><i></i></button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu"></div>

  <main id="view" tabindex="-1"></main>

  <footer class="footer" id="footer"></footer>

  <!-- cart drawer -->
  <div class="drawer-scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Cart" aria-hidden="true"></aside>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
